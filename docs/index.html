<style>

}

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 'IBM Plex Sans',system-ui,sans-serif}
button{font-family:'IBM Plex Sans',system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
#map{position:fixed;inset:0;background:var(--map)}
.leaflet-container{font:inherit;background:var(--map)}
.leaflet-top.leaflet-right{top:64px;right:10px}

.leaflet-bar a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--faint)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-control-scale-line{background:var(--panel);color:var(--ink);border-color:var(--ink);font:11px 'IBM Plex Mono'}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.lbl{font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* place labels */
.plabel{background:none;border:0}
.plabel span{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:500 12px 'IBM Plex Sans';color:#fff;text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.8);pointer-events:none}
.plabel.city span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #0F1A2A;margin-right:5px;vertical-align:1px}
.plabel.area span{font:500 11px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;color:#FFF7D6}
.plabel.water span{font-style:italic;color:#CFE8FF}

/* top bar */
#top{position:fixed;left:12px;right:12px;top:12px;z-index:1000;display:flex;align-items:stretch;gap:10px;pointer-events:none}
#top > *{pointer-events:auto}
#brand{display:flex;align-items:center;gap:12px;padding:8px 14px}

#brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
#brand h1 span{color:var(--faint);font-weight:400}
#brand .sub{font-size:11.5px;color:var(--muted);line-height:1.2}
#top .sp{flex:1}
.seg{display:flex;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px 'IBM Plex Sans';padding:6px 12px;border-radius:5px;cursor:pointer;text-align:left;line-height:1.15}
.seg button small{display:block;font:400 10px 'IBM Plex Mono';letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button.on small{color:var(--accent)}
#lang button{font:500 12px 'IBM Plex Mono';padding:6px 9px}
#tourBtn{border:0;background:var(--accent);color:#fff;font:600 13px 'IBM Plex Sans';padding:0 16px;border-radius:8px;cursor:pointer;box-shadow:var(--shadow)}

#panel{position:fixed;left:12px;top:68px;bottom:96px;width:372px;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);padding:0 4px}
#tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 12.5px 'IBM Plex Sans';padding:11px 1px 9px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{display:none;overflow-y:auto;padding:14px 16px 20px;flex:1}
.pane.on{display:block}
.mode{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.mode b{display:block;font-size:14.5px;margin:2px 0}
.mode p{margin:0;color:var(--muted);font-size:12.5px}
.group{margin:14px 0 6px}
.layer{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--panel-2)}
.layer.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.layer .rb{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);margin-top:3px}
.layer.on .rb{border:4px solid var(--accent)}
.layer b{font-weight:500;font-size:13.5px}
.layer small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
h3{font-size:15px;font-weight:600;margin:16px 0 6px}
h3:first-child{margin-top:0}
.pane p,.pane li{color:var(--muted);font-size:13px}
.pane p b,.pane li b{color:var(--ink);font-weight:600}
.pane ul{padding-left:18px}
.pane img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kpi div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel-2)}
.kpi b{display:block;font:500 20px 'IBM Plex Mono';color:var(--ink);line-height:1.2}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi.big b{font-size:24px}
.who{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;margin:8px 0}
.who i{font-style:normal;width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px 'IBM Plex Mono'}
.who p{margin:0}
.hint{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
td{font-family:'IBM Plex Mono',monospace}
th{font-weight:500;color:var(--faint);font-size:11px;font-family:'IBM Plex Mono'}
th:first-child,td:first-child{text-align:left;font-family:'IBM Plex Sans'}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font:500 11px 'IBM Plex Mono';margin-right:6px}
.verdict{margin-top:10px;font-size:13px;line-height:1.55;color:var(--ink)}
.verdict p{margin:6px 0;color:var(--ink)}
.theme{display:flex;gap:4px;margin-top:12px}
.theme button{border:1px solid var(--line);background:transparent;color:var(--muted);font:12px 'IBM Plex Sans';padding:4px 10px;border-radius:5px;cursor:pointer}
.theme button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.src{font-size:11.5px!important;color:var(--faint)!important}
.src a{color:var(--accent)}

/* timeline */
#timeline{position:fixed;left:396px;right:12px;bottom:28px;z-index:1000;padding:8px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#dates{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#dates button{border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;cursor:pointer;font:500 12.5px 'IBM Plex Mono'}
#dates button:last-child{border-right:0}
#dates button.on{background:var(--accent);color:#fff}
#dates button:disabled{color:var(--faint);cursor:default;background:var(--panel-2)}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 12.5px 'IBM Plex Sans';padding:6px 12px;border-radius:6px;cursor:pointer}
.tbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tbtn:disabled{opacity:.4;cursor:default}
#legend{flex:1;min-width:200px}
#legend .bar{height:8px;border-radius:2px;margin-top:3px}
#legend .ticks{display:flex;justify-content:space-between;font:11px 'IBM Plex Mono';color:var(--muted);margin-top:2px}
.op{display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--accent);width:96px}
#coords{position:fixed;left:396px;bottom:6px;z-index:1000;font:11px 'IBM Plex Mono';color:var(--muted);background:var(--panel);padding:1px 8px;border-radius:4px;border:1px solid var(--line)}

/* compare */
#divider{position:absolute;top:0;bottom:0;width:0;z-index:650;display:none;pointer-events:none}
#divider .ln{position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#divider .h{position:absolute;top:50%;left:-17px;width:34px;height:34px;margin-top:-17px;border-radius:50%;background:#fff;color:#0F1A2A;display:grid;place-items:center;font:600 13px 'IBM Plex Mono';box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:auto;cursor:ew-resize;touch-action:none}
#divider .dl{position:absolute;top:76px;font:500 11px 'IBM Plex Mono';background:rgba(15,26,42,.85);color:#fff;padding:2px 7px;border-radius:4px;white-space:nowrap}
#divider .dl.l{right:10px}#divider .dl.r{left:10px}

/* tour */
#tour{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;width:min(560px,calc(100% - 24px));z-index:1100;display:none;padding:14px 16px;border-left:3px solid var(--accent)}
#tour .n{font:500 11px 'IBM Plex Mono';color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
#tour h4{margin:2px 0 4px;font-size:16px}
#tour p{margin:0;color:var(--muted);font-size:13.5px}
#tour p b{color:var(--ink)}
#tour .nav{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#tour button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px 'IBM Plex Sans';padding:6px 14px;border-radius:6px;cursor:pointer}
#tour button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
#tour button:disabled{opacity:.4}

@media (min-width:861px){ #tour{left:calc(50% + 192px)} }
@media (max-width:860px){
  #brand .sub,#regions button small{display:none}
  #brand{padding:6px 8px}#brand h1{font-size:14px}
  #regions button{padding:6px 7px;font-size:12px}
  #lang button{padding:6px 5px}
  #tourBtn{padding:0 9px;font-size:12px}
  #top{flex-wrap:wrap}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:44vh;border-radius:10px 10px 0 0}
  #timeline{left:8px;right:8px;bottom:calc(44vh + 8px);gap:8px;padding:6px 8px}
  .op,#coords{display:none}
  #legend{min-width:110px}
  #tour{bottom:calc(44vh + 64px);left:50%}
}
</style>

const SRC_JIRCAS = `<a href="https://jircas.repo.nii.ac.jp/record/2000230/files/jircas_working_report88-_9-21.pdf" target="_blank" rel="noopener">JIRCAS Working Report 88</a>`;

const TX = {
en:{
  sub:"Soil salinity from L-band SAR polarimetry", tour:"▶ Tour",
  tab_layers:"Layers", tab_field:"Inspect", tab_evidence:"Evidence", tab_impact:"Impact", tab_method:"Method",
  acq:"Acquisition", opacity:"Opacity", cmp:"⇆ Compare", labels:"Labels", close:"Close", back:"Back", next:"Next", finish:"Finish", step:"Step",
  theme:["Auto","Light","Dark"],
  region:{mirzachul:["Mirzachul, UZ","global · DH","Mirzachul & Syrdarya (Uzbekistan)"], rann:["Rann of Kutch","precision · QP","Rann of Kutch / Thar (Pakistan–India)"]},
  mode:{precision:["Precision mode · quad-pol","HH, HV, VH, VV + complex HH·VV*. Phase-based salt detection."], global:["Global mode · dual-pol","HH + HV + SME2 moisture. Change detection and salinization risk screening."]},
  groups:{Backscatter:"Backscatter", Change:"Change", Soil:"Soil", Salinity:"Salinity"},
  layers:{
    RGB:["Pauli-like RGB","R = HH, G = HV, B = HH−HV"], HV:["HV backscatter σ⁰","Volume scattering: vegetation"],
    dHV:["ΔHV since first date","Negative = vegetation loss (harvest, crop failure)"], dHH:["ΔHH since first date","Surface change: wetting, tillage, flooding"],
    SM:["Soil moisture (SME2)","NISAR L3 product, 200 m"], RISK:["Salinization risk index","Wet yet bare all season; top 30% shown"],
    PHASE:["HH–VV phase difference","Referenced to dry Thar dunes"], SALT:["Salt signature","Bare surface, φ ≥ +5° on every date"]},
  ticks:{RISK:["P70","P85","P100"], SALT:["detected on all dates",""]}, leg:{RISK:"Risk percentile", SALT:"Salt signature"},
  probe_empty:"<h3>Inspect a location</h3><p class='hint'>Click the radar image to read σ⁰, soil moisture and phase for a ~600 m cell on every acquisition date.</p>",
  probe_nodata:"<h3>No data</h3><p class='hint'>Outside the NISAR swath or masked. Click inside the radar image.</p>",
  cell:"Cell ~600 m", sm:"mᵥ, m³/m³", dphi:"Δφ vs sand, °",
  risk_hi:"Wet yet sparsely vegetated through the season — candidate salt-affected land.", risk_lo:"No salinization symptom from moisture/vegetation.",
  hv_loss:"Strong vegetation loss: harvest or crop failure.", hv_gain:"Vegetation growth during the season.", hv_flat:"Vegetation roughly stable.",
  salt_sig:"SALT SIGNATURE", salt_txt:"Δφ ≥ +5° on every date. Model: salt crust +4…+9°, moisture ≈ 0°.", no_sig:"NO STABLE SIGNATURE",
  tourSteps:[
    ["NISAR over Uzbekistan","An L-band radar scene from 13 Oct 2026 covering Tashkent, the Syrdarya valley and the <b>Mirzachul (Hungry Steppe)</b> irrigation zone. Green = vegetation, purple = bare smooth ground."],
    ["A season of change","HV change June → October. <b>Blue</b> = vegetation lost: the cotton and wheat harvest. Bare soil after harvest is exactly when salt is easiest to see."],
    ["Where salt is likely","Land that stays <b>wet</b> (NISAR soil moisture) but <b>bare</b> all season. <b>35%</b> of Mirzachul falls in the top-risk class vs 13% scene-wide. Syrdarya region: 99% of irrigated land is slightly-to-moderately saline."],
    ["Precision mode: Rann of Kutch","A quad-pol scene over one of the world's largest salt flats (dark, centre) and the non-saline sand dunes of the Thar desert (north)."],
    ["The salt fingerprint","HH–VV phase relative to the dunes. Our physics model predicts <b>+4…+9°</b> for a salt crust and ≈0° for wet soil. The salt flat reads <b>+5…+14°</b> on all three dates."],
    ["Persistent salt signature","Bare ground whose phase stays ≥ +5° on every date: not a passing rain, but a permanent dielectric property — salt."],
    ["How sure are we?","Phase alone separates salt flat from sand with <b>77–90%</b> accuracy. Moisture and surface roughness do not explain the shift. Full evidence in the panel."]],
  evidence:`
    <h3>Precision mode · is the phase signal salt?</h3>
    <div class="kpi"><div><b>+4…+9°</b><span>model, salt crust vs dry sand</span></div><div><b>−0.2°</b><span>model, moisture 0.05→0.35</span></div></div>
    <p><b>Forward model.</b> Soil dielectric model at 1.257 GHz (Stogryn saline water + Dobson mixing) with first-order Bragg (SPM) backscatter. Over 20 000 random soils, log-salinity explains <b>74%</b> of HH–VV phase variance, moisture <b>13%</b>, incidence angle <b>6%</b>.</p>
    <img src="phase_model.png" alt="Modelled HH–VV phase over soil moisture and salt content">
    <p style="margin-top:14px"><b>Natural experiment on NISAR quad-pol data.</b> Great Rann of Kutch salt flat vs non-saline Thar dunes; zones defined geographically; bare-surface pixels only.</p>
    <div class="kpi"><div><b>+5…+14°</b><span>salt flat vs sand, all 3 dates</span></div><div><b>0.77–0.90</b><span>balanced accuracy, phase only</span></div></div>
    <img src="evidence.png" alt="Observed salt-flat phase shift on three dates and phase-only separability">
    <ul>
      <li>Sign and magnitude agree with the model.</li>
      <li><b>Not moisture:</b> NISAR SME2 retrieves the salt flat as <i>drier</i> than the dunes.</li>
      <li><b>Not roughness:</b> comparing salt-flat and sand pixels of equal roughness (same depolarisation), the shift stays <b>+8°, +12°, +4°</b>.</li>
      <li><b>Control</b> (Khadir/Bela islands): sign changes between dates.</li>
    </ul>
    <h3>Global mode · does the risk index point at known saline land?</h3>
    <div class="kpi"><div><b>35%</b><span>Mirzachul land in top-risk class</span></div><div><b>13%</b><span>same class, whole scene</span></div></div>
    <p>The index flags the Mirzachul (Hungry Steppe) irrigation zone <b>2.6×</b> more often than the scene average. In Syrdarya region 99.1% of irrigated land was rated slightly-to-moderately saline.</p>
    <p class="src">Source: ${SRC_JIRCAS}</p>`,
  impact:`
    <h3>Why it matters</h3>
    <div class="kpi big"><div><b>1.4 bn ha</b><span>salt-affected land worldwide, 10.7% of all land</span></div><div><b>+1 bn ha</b><span>more at risk from climate change and mismanagement</span></div></div>
    <div class="kpi big"><div><b>$27 bn</b><span>crop losses per year in salt-degraded irrigated land</span></div><div><b>−70%</b><span>yield loss for rice or beans in the worst-hit areas</span></div></div>
    <div class="kpi big"><div><b>&gt;50%</b><span>of Uzbekistan's irrigated land is saline</span></div><div><b>99%</b><span>of irrigated land in Syrdarya region (Mirzachul)</span></div></div>
    <p>Salt is usually seen only when a white crust appears — after the harvest is lost. Radar phase can flag it earlier, everywhere NISAR flies: all land on Earth every 12 days, free and open.</p>
    <h3>Who would use it</h3>
    <div class="who"><i>1</i><p><b>Farmers and water user associations</b> — know which fields need leaching or salt-tolerant crops before sowing.</p></div>
    <div class="who"><i>2</i><p><b>Ministries of agriculture and water</b> — target drainage repair where salt is spreading, not where it is already visible.</p></div>
    <div class="who"><i>3</i><p><b>FAO and development banks</b> — monitor salinity trends across countries with one consistent, free method.</p></div>
    <h3>Next steps</h3>
    <ul><li>Run on every NISAR quad-pol site in irrigated regions: Central Asia, Indus, Middle East, Australia, California.</li><li>Calibrate the risk index with field ECe samples.</li><li>Seasonal alerts when a field's salt signature appears.</li></ul>
    <p class="src">Sources: ${SRC_FAO}; ${SRC_QADIR}; ${SRC_JIRCAS}</p>`,
  method:`
    <h3>Physical basis</h3>
    <p>Dissolved salt adds ionic conductivity σ to soil water, raising the imaginary permittivity <span class="mono">ε″ = σ/(2πfε₀)</span> — hence our name. A complex ε rotates the phase between HH and VV backscatter; water mainly raises ε′, which changes amplitude but hardly the phase. Phase therefore separates salt from moisture where amplitude cannot.</p>
    <h3>Processing</h3>
    <ul>
      <li>NISAR L2 GCOV (20 m), 10×10 multilook → 200 m. Complex HH·VV* averaged before taking the angle.</li>
      <li>Phase referenced to dry Thar dunes (ε″ ≈ 0), removing the per-scene calibration offset of provisional products (+61° Jun/Jul, −96° Oct).</li>
      <li>Risk = P(soil moisture) × (1 − P(season-max HV)), P = percentile within scene; open water removed.</li>
      <li>Salt signature = bare surface with phase ≥ +5° on every available date (≥ 2 dates).</li>
    </ul>
    <h3>Limitations</h3>
    <ul>
      <li>Provisional products; one quad-pol site so far.</li>
      <li>Risk is a screening index; calibration needs field ECe samples.</li>
      <li>L-band sensitivity to salt is modest; the method works best on bare soil.</li>
    </ul>
    <p class="src">Data: NASA-ISRO NISAR L2 GCOV, L3 SME2 (provisional), NASA Earthdata / ASF DAAC. Code: MIT licence. Team ε″ · NASA Space Apps Challenge 2026.</p>`,
},

  tourSteps:[

  method:`
    <h3>Физическая основа</h3>
    <p>Растворённая соль добавляет почвенной воде ионную проводимость σ и повышает мнимую часть проницаемости <span class="mono">ε″ = σ/(2πfε₀)</span> — отсюда наше название. Комплексная ε поворачивает фазу между сигналами HH и VV; вода в основном повышает ε′, а это меняет силу сигнала, но почти не меняет фазу. Поэтому фаза отделяет соль от влаги там, где амплитуда не может.</p>
    <h3>Обработка</h3>
    <ul>
      <li>NISAR L2 GCOV (20 м), усреднение 10×10 → 200 м. Комплексный HH·VV* усредняется до вычисления угла.</li>
      <li>Фаза отсчитывается от сухих песков Тара (ε″ ≈ 0) — так убирается калибровочный сдвиг предварительных снимков (+61° в июне–июле, −96° в октябре).</li>
      <li>Риск = P(влажность) × (1 − P(максимум HV за сезон)), P — перцентиль по снимку; открытая вода исключена.</li>
      <li>Сигнатура соли = голая почва с фазой ≥ +5° на каждой доступной дате (не меньше 2 дат).</li>
    </ul>
    <h3>Ограничения</h3>
    <ul>
      <li>Предварительные продукты; пока один регион с 4 поляризациями.</li>
      <li>Индекс риска — инструмент для поиска; для калибровки нужны полевые пробы ECe.</li>
      <li>В L-диапазоне чувствительность к соли умеренная; метод лучше всего работает на голой почве.</li>
    </ul>
    <p class="src">Данные: NASA-ISRO NISAR L2 GCOV, L3 SME2 (предварительные), NASA Earthdata / ASF DAAC. Код: лицензия MIT. Команда ε″ · NASA Space Apps Challenge 2026.</p>`,

  [40.650, 68.880, {en:"Syr Darya", ru:"р. Сырдарья", uz:"Sirdaryo daryosi"}, "water"],
  [24.020, 70.150, {en:"Great Rann of Kutch", ru:"Большой Ранн Кач", uz:"Katta Kach Ranni"}, "area"],
  [24.620, 69.950, {en:"Thar Desert", ru:"Пустыня Тар", uz:"Tar choʻli"}, "area"],
  [23.840, 70.700, {en:"Khadir Bet", ru:"о. Кхадир", uz:"Xadir oroli"}, "area"],
];

/* ======================= APP ======================= */
const CUBE_STEP = 0.006;
const RDBU = "linear-gradient(90deg,#053061,#2166ac,#92c5de,#f7f7f7,#f4a582,#b2182b,#67001f)";
const LAYER_DEF = {
  RGB:{g:"Backscatter", dated:true, cmp:true},
  HV:{g:"Backscatter", dated:true, cmp:true, legend:{t:"σ⁰ HV", grad:"linear-gradient(90deg,#000,#fff)", ticks:["−32 dB","−21","−10 dB"]}},
  dHV:{g:"Change", dated:true, skipFirst:true, legend:{t:"ΔHV", grad:RDBU, ticks:["−6 dB","0","+6 dB"]}},
  dHH:{g:"Change", dated:true, skipFirst:true, legend:{t:"ΔHH", grad:RDBU, ticks:["−6 dB","0","+6 dB"]}},
  SM:{g:"Soil", dated:true, cmp:true, legend:{t:"mᵥ", grad:"linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)", ticks:["0.02","0.21","0.40 m³/m³"]}},
  RISK:{g:"Salinity", dated:false, legend:{t:"RISK", grad:"linear-gradient(90deg,#fcfdbf,#fc8961,#b73779,#51127c,#000004)"}},
  PHASE:{g:"Salinity", dated:true, cmp:true, legend:{t:"φ(HH·VV*) − φ_sand", grad:RDBU, ticks:["−25°","0°","+25°"]}},
  SALT:{g:"Salinity", dated:false, legend:{t:"SALT", grad:"linear-gradient(90deg,#E4572E,#E4572E)"}},
};
const TOUR = [
  {r:"mirzachul", l:"RGB", d:2}, {r:"mirzachul", l:"dHV", d:2, c:[40.45,68.6], z:10}, {r:"mirzachul", l:"RISK", c:[40.55,68.55], z:10},
  {r:"rann", l:"RGB", d:1}, {r:"rann", l:"PHASE", d:1, c:[24.08,70.1], z:9}, {r:"rann", l:"SALT", c:[24.17,69.6], z:10}, {tab:"evidence"},
];

let META, region, layer = "RGB", dateIdx = 2, overlay = null, before = null, cubes = {}, marker = null, cmpOn = false, swipeX = .5, tourI = -1, lastLL = null;
let LANG = "en", labelsOn = true, labelLayer = null;
try{ const l = localStorage.getItem("lang"); if(l && TX[l]) LANG = l; }catch(e){}
const T = k => TX[LANG][k];
const $ = s => document.querySelector(s);
const map = L.map("map", {zoomControl:false, preferCanvas:true});
L.control.zoom({position:"topright"}).addTo(map);
L.control.scale({position:"topright", imperial:false}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:17, attribution:"Basemap © Esri · SAR: NASA-ISRO NISAR"}).addTo(map);
map.createPane("before"); map.getPane("before").style.zIndex = 410;
map.createPane("labels"); map.getPane("labels").style.zIndex = 640; map.getPane("labels").style.pointerEvents = "none";

const fmtDate = d => `${+d.slice(6)} ${MONTHS[LANG][+d.slice(4,6)-1]}`;

function setTheme(t){
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("theme", t) }catch(e){}
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
}
function curTheme(){ return document.documentElement.getAttribute("data-theme") || "auto"; }

function showTab(p){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  document.querySelectorAll(".pane").forEach(x => x.classList.toggle("on", x.id === "p-" + p));
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.p));

function drawLabels(){
  if(labelLayer) labelLayer.remove();
  labelLayer = L.layerGroup(PLACES.map(([la, lo, n, kind]) => L.marker([la, lo], {pane:"labels", interactive:false, keyboard:false,
    icon:L.divIcon({className:`plabel ${kind}`, html:`<span>${n[LANG]}</span>`, iconSize:[0,0]})})));
  if(labelsOn) labelLayer.addTo(map);
}

function applyLang(){
  document.documentElement.lang = LANG;
  try{ localStorage.setItem("lang", LANG) }catch(e){}
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("#p-evidence").innerHTML = T("evidence");
  $("#p-impact").innerHTML = T("impact");
  const th = T("theme");
  $("#p-about").innerHTML = T("method") + `<div class="theme" id="themeSeg"><button data-t2="auto">${th[0]}</button><button data-t2="light">${th[1]}</button><button data-t2="dark">${th[2]}</button></div>`;
  document.querySelectorAll("#themeSeg button").forEach(b => { b.dataset.t = b.dataset.t2; b.onclick = () => setTheme(b.dataset.t2); });
  setTheme(curTheme());
  $("#cmp").textContent = T("cmp"); $("#lblBtn").textContent = T("labels");
  $("#tourX").textContent = T("close"); $("#tourB").textContent = T("back");
  $("#regions").innerHTML = "";
  for(const k of ["mirzachul","rann"]){
    const b = document.createElement("button"), r = T("region")[k];
    b.innerHTML = `${r[0]}<small>${r[1]}</small>`; b.dataset.k = k; b.onclick = () => selectRegion(k);
    b.classList.toggle("on", k === region); $("#regions").appendChild(b);
  }
  drawLabels();
  if(META){ renderLayers(); draw(); if(lastLL && marker) probe(lastLL, true); else $("#probe").innerHTML = T("probe_empty"); if(tourI >= 0) tourGo(tourI, true); }
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => { LANG = b.dataset.l; applyLang(); });

async function init(){
  applyLang();
  META = await (await fetch("data/meta.json")).json();
  $("#opacity").oninput = e => { const o = e.target.value/100; overlay && overlay.setOpacity(o); before && before.setOpacity(o); };
  $("#cmp").onclick = () => { cmpOn = !cmpOn; draw(); };
  $("#lblBtn").onclick = () => { labelsOn = !labelsOn; $("#lblBtn").classList.toggle("on", labelsOn); drawLabels(); };
  map.on("click", e => probe(e.latlng));
  map.on("mousemove", e => $("#coords").textContent = `${e.latlng.lat.toFixed(4)}° N  ${e.latlng.lng.toFixed(4)}° E`);
  map.on("move zoom resize", clip);
  setupDivider();
  $("#tourBtn").onclick = () => tourGo(0);
  $("#tourX").onclick = () => tourGo(-1);
  $("#tourB").onclick = () => tourGo(Math.max(0, tourI-1));
  $("#tourF").onclick = () => tourGo(tourI+1 < TOUR.length ? tourI+1 : -1);
  selectRegion("mirzachul");
}

function fit(R){
  const wide = innerWidth > 860;
  map.fitBounds(R.bounds, {paddingTopLeft: wide ? [396, 70] : [0, 60], paddingBottomRight: wide ? [20, 100] : [0, innerHeight*.48]});
}

function renderLayers(){
  const R = META.regions[region], m = T("mode")[R.mode];
  $("#modeBox").innerHTML = `<div class="mode"><div class="lbl">${m[0]}</div><b>${T("region")[region][2]}</b><p>${m[1]}</p></div>`;
  let html = "", g = null;
  for(const L_ of R.layers){
    const D = LAYER_DEF[L_], n = T("layers")[L_];
    if(D.g !== g){ g = D.g; html += `<div class="lbl group">${T("groups")[g]}</div>`; }
    html += `<div class="layer ${L_===layer?"on":""}" data-l="${L_}"><span class="rb"></span><span><b>${n[0]}</b><small>${n[1]}</small></span></div>`;
  }
  $("#layers").innerHTML = html;
  document.querySelectorAll(".layer").forEach(el => el.onclick = () => setLayer(el.dataset.l));
  document.querySelectorAll("#regions button").forEach(b => b.classList.toggle("on", b.dataset.k === region));
}

function selectRegion(k, noFit){
  region = k; const R = META.regions[k];
  if(!R.layers.includes(layer)) layer = "RGB";
  dateIdx = R.dates.length - 1;
  renderLayers();
  if(!noFit) fit(R);
  if(marker){ marker.remove(); marker = null; } lastLL = null;
  $("#probe").innerHTML = T("probe_empty");
  loadCube(k); draw();
}

function setLayer(l){ layer = l; document.querySelectorAll(".layer").forEach(x => x.classList.toggle("on", x.dataset.l === l)); draw(); }

function draw(){
  const R = META.regions[region], D = LAYER_DEF[layer], n = T("layers")[layer];
  if(D.skipFirst && dateIdx === 0) dateIdx = 1;
  if(!D.cmp) cmpOn = false;
  if(cmpOn && dateIdx === 0) dateIdx = R.dates.length - 1;
  $("#cmp").disabled = !D.cmp; $("#cmp").classList.toggle("on", cmpOn);
  $("#dates").innerHTML = R.dates.map((d,i) => `<button data-i="${i}" class="${D.dated && i===dateIdx?"on":""}" ${!D.dated || (D.skipFirst && i===0) || (cmpOn && i===0) ? "disabled" : ""}>${fmtDate(d)}</button>`).join("");
  document.querySelectorAll("#dates button").forEach(b => b.onclick = () => { dateIdx = +b.dataset.i; draw(); });
  const op = $("#opacity").value/100;
  const file = D.dated ? `${layer}_${R.dates[dateIdx]}.webp` : `${layer}.webp`;
  if(overlay) overlay.remove();
  overlay = L.imageOverlay(`data/${region}/${file}`, R.bounds, {opacity:op, interactive:false}).addTo(map);
  if(before){ before.remove(); before = null; }
  if(cmpOn){
    before = L.imageOverlay(`data/${region}/${layer}_${R.dates[0]}.webp`, R.bounds, {opacity:op, interactive:false, pane:"before"}).addTo(map);
    $("#divider .dl.l").textContent = "◀ " + fmtDate(R.dates[0]);
    $("#divider .dl.r").textContent = fmtDate(R.dates[dateIdx]) + " ▶";
  }
  $("#divider").style.display = cmpOn ? "block" : "none";
  clip();
  const lg = D.legend;
  if(lg){
    const title = T("leg")[layer] || lg.t, ticks = T("ticks")[layer] || lg.ticks;
    $("#legend").innerHTML = `<div class="lbl">${title}</div><div class="bar" style="background:${lg.grad}"></div><div class="ticks">${ticks.map(t=>`<span>${t}</span>`).join("")}</div>`;
  } else $("#legend").innerHTML = `<div class="lbl">${n[0]}</div><div class="ticks"><span>${n[1]}</span></div>`;
}

function setupDivider(){
  const d = document.createElement("div"); d.id = "divider";
  d.innerHTML = `<div class="ln"></div><div class="dl l"></div><div class="dl r"></div><div class="h">⇆</div>`;
  map.getContainer().appendChild(d);
  const h = d.querySelector(".h");
  L.DomEvent.disableClickPropagation(d);
  let drag = false;
  h.addEventListener("pointerdown", e => { drag = true; h.setPointerCapture(e.pointerId); map.dragging.disable(); e.preventDefault(); });
  h.addEventListener("pointermove", e => {
    if(!drag) return;
    const r = map.getContainer().getBoundingClientRect();
    swipeX = Math.min(.98, Math.max(.02, (e.clientX - r.left)/r.width)); clip();
  });
  const up = () => { drag = false; map.dragging.enable(); };
  h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
}

function clip(){
  const pane = map.getPane("before"), size = map.getSize(), x = size.x * swipeX;
  const dv = $("#divider"); if(dv) dv.style.left = x + "px";
  if(!cmpOn){ pane.style.clip = ""; return; }
  const nw = map.containerPointToLayerPoint([0,0]), se = map.containerPointToLayerPoint(size);
  pane.style.clip = `rect(${nw.y}px, ${nw.x + x}px, ${se.y}px, ${nw.x}px)`;
}

async function loadCube(k){
  if(cubes[k]) return;
  const b64 = (await (await fetch(`data/${k}/cube.txt`)).text()).trim();
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  cubes[k] = a;
}

function val(k, band, r, c){
  const R = META.regions[k], [H, W] = R.cube_shape, q = cubes[k][band*H*W + r*W + c];
  if(q === 255) return null;
  const [lo, hi] = META.quant[R.cube_order[band][1]];
  return lo + q*(hi-lo)/250;
}

function probe(ll, silent){
  const R = META.regions[region];
  if(!cubes[region] || (tourI >= 0 && !silent)) return;
  const [[, lon0], [lat1]] = R.bounds, [H, W] = R.cube_shape;
  const r = Math.floor((lat1 - ll.lat)/CUBE_STEP), c = Math.floor((ll.lng - lon0)/CUBE_STEP);
  if(r < 0 || c < 0 || r >= H || c >= W) return;
  const rows = {};
  R.cube_order.forEach(([d, key], band) => { (rows[key] ||= {})[d] = val(region, band, r, c); });
  if(!silent) showTab("field");
  if(!R.dates.some(d => rows.HH[d] !== null)){ $("#probe").innerHTML = T("probe_nodata"); return; }
  lastLL = ll;
  if(marker) marker.setLatLng(ll); else marker = L.circleMarker(ll, {radius:6, color:"#fff", weight:2, fillColor:"#1D5FB0", fillOpacity:1}).addTo(map);
  const keys = ["HH","HV","VV","SM","PHASE"].filter(k => rows[k]);
  const name = {HH:"σ⁰ HH, dB", HV:"σ⁰ HV, dB", VV:"σ⁰ VV, dB", SM:T("sm"), PHASE:T("dphi")};
  const f = (k, v) => v === null ? "—" : (k === "SM" ? v.toFixed(2) : (k === "PHASE" && v > 0 ? "+" : "") + v.toFixed(1));
  let html = `<div class="lbl">${T("cell")} · ${T("region")[region][2]}</div><h3 class="mono" style="margin-top:2px">${ll.lat.toFixed(4)}° N, ${ll.lng.toFixed(4)}° E</h3>
  <table><tr><th></th>${R.dates.map(d => `<th>${fmtDate(d)}</th>`).join("")}</tr>
  ${keys.map(k => `<tr><td>${name[k]}</td>${R.dates.map(d => `<td>${f(k, rows[k][d])}</td>`).join("")}</tr>`).join("")}</table>`;
  html += chart(R.dates, rows);
  const v = [];
  if(R.mode === "global" && rows.RISK.all !== null){
    const p = Math.round(rows.RISK.all*100), col = p >= 90 ? "var(--alert)" : p >= 70 ? "#B7791F" : "var(--ok)";
    v.push(`<p><span class="tag" style="background:${col};color:#fff">RISK P${p}</span>${p >= 70 ? T("risk_hi") : T("risk_lo")}</p>`);
  }
  const hvs = R.dates.map(d => rows.HV[d]).filter(x => x !== null);
  if(hvs.length > 1){ const dv = hvs[hvs.length-1] - hvs[0]; v.push(`<p><span class="tag" style="background:var(--accent-soft);color:var(--accent)">ΔHV ${dv>0?"+":""}${dv.toFixed(1)} dB</span>${dv < -2 ? T("hv_loss") : dv > 2 ? T("hv_gain") : T("hv_flat")}</p>`); }
  if(rows.PHASE){
    const ph = R.dates.map(d => rows.PHASE[d]).filter(x => x !== null);
    const sig = rows.SALT ? rows.SALT.all : null;
    if(sig !== null && sig >= 0.99) v.push(`<p><span class="tag" style="background:#E4572E;color:#fff">${T("salt_sig")}</span>${T("salt_txt")}</p>`);
    else if(ph.length) v.push(`<p><span class="tag" style="background:var(--panel-2);color:var(--muted);border:1px solid var(--line)">${T("no_sig")}</span>Δφ = ${ph.map(x=>(x>0?"+":"")+x.toFixed(0)+"°").join(", ")}.</p>`);
  }
  html += `<div class="verdict">${v.join("")}</div>`;
  $("#probe").innerHTML = html;
}

function chart(dates, rows){
  const series = [["HV","σ⁰ HV (dB)","var(--accent)"]];
  if(rows.PHASE) series.push(["PHASE","Δφ (°)","#E4572E"]);
  return series.map(([k, label, col]) => {
    const vals = dates.map(d => rows[k][d]), ok = vals.filter(v => v !== null); if(ok.length < 2) return "";
    const w = 320, h = 74, lo = Math.min(...ok), hi = Math.max(...ok), pad = Math.max(1, (hi-lo)*.25);
    const y = v => 12 + (1 - (v-(lo-pad))/((hi+pad)-(lo-pad)))*(h-30);
    const pts = vals.map((v,i) => v === null ? null : [28 + i*(w-48)/(vals.length-1), y(v), v]).filter(Boolean);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="margin-top:8px;color:var(--faint);font-family:IBM Plex Mono">
      <text x="0" y="9" font-size="10" fill="currentColor">${label}</text>
      <line x1="20" x2="${w-12}" y1="${h-16}" y2="${h-16}" stroke="currentColor" stroke-opacity=".4"/>
      <polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="${col}" stroke-width="2"/>
      ${pts.map((p,i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"/><text x="${p[0]}" y="${p[1]-7}" font-size="10" fill="currentColor" text-anchor="middle">${p[2].toFixed(1)}</text><text x="${p[0]}" y="${h-3}" font-size="10" fill="currentColor" text-anchor="middle">${fmtDate(dates[i])}</text>`).join("")}</svg>`;
  }).join("");
}

function tourGo(i, textOnly){
  tourI = i;
  if(i < 0){ $("#tour").style.display = "none"; return; }
  const s = TOUR[i];
  if(!textOnly){
    if(s.r){
      if(s.r !== region) selectRegion(s.r, true);
      showTab("layers");
      if(s.l) setLayer(s.l);
      if(s.d !== undefined){ dateIdx = s.d; draw(); }
      if(s.c) map.flyTo(s.c, s.z, {duration:1.2}); else fit(META.regions[region]);
    }
    if(s.tab) showTab(s.tab);
  }
  const st = T("tourSteps")[i];
  $("#tourN").textContent = `${T("step")} ${i+1} / ${TOUR.length}`;
  $("#tourT").textContent = st[0]; $("#tourP").innerHTML = st[1];
  $("#tourB").disabled = i === 0; $("#tourF").textContent = i === TOUR.length-1 ? T("finish") : T("next");
  $("#tour").style.display = "block";
}

init();
</script>
</body>
</html>
